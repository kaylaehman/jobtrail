server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin reverse proxy for the JobTrail API.
  # Picked up when the frontend is built with VITE_API_URL="" (homelab / Portainer flow),
  # so the React bundle issues calls to "/api/..." and they get forwarded to the backend
  # container over the compose network. Harmless for the localhost flow because that
  # bundle hits http://localhost:8000 directly and never touches this proxy.
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
